name: Publish ALCOM repository
on:
  push:
    branches: [alcom]
    paths: ['alcom/**', '.github/workflows/vpm.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: vpm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CoplayDev/unity-mcp
          ref: main
          path: _upstream/stable
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CoplayDev/unity-mcp
          ref: beta
          path: _upstream/beta
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Test packaging
        run: python -m unittest discover -s alcom/tests -v
      - name: Build, smoke test and publish releases
        run: python alcom/publish.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload VPM listing
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publish VPM listing
        id: deployment
        uses: actions/deploy-pages@v4
